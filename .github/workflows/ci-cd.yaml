name: ci-cd developments / Pipeline

on: [push]

jobs:
   build:
     name: 🛠️ Build Frontend
     runs-on: ubuntu-latest
     steps:
       - name: checkout
         uses: actions/checkout@v3

       - name: Install dependencies
         run: npm i

       - name: Build react
         env:
           CI: false
         run: npm run build

       - name: List build directory
         run: ls -al build

       - name: Upload artifact
         uses: actions/upload-pages-artifact@v1
         with:
            path: build

   security-audit:
     name: Audit Deps
     needs: build
     runs-on: ubuntu-latest
     steps:
       - name: checkout code
         uses: actions/checkout@v3

       - name: ensure node installed and right version
         uses: actions/setup-node@v3
         with:
           node-version: 16.x

       - name: audit
         run: npm audit --omit=dev

   lint:
     name: 🧼 Ensure Code Style
     runs-on: ubuntu-latest
     needs: build
     steps:
       - uses: actions/checkout@v3

       - name: Setup Node 16
         uses: actions/setup-node@v3
         with:
           node-version: 16.x

       - name: Install deps
         run: npm i

       - name: 😂 Lint code
         run:  npm run lint

