name: ci-cd developments / Pipeline

on: [push]

jobs:
   build:
     name: 🛠️ Build Frontend
     runs-on: ubuntu-latest
     steps:
       - name: checkout
         uses: actions/checkout@v3

       - name: Install dependencies
         run: npm i

       - name: build react
         uses: npm run build

       - name: upload-file
         uses: actions/upload-pages-artifact@v1

